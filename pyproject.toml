[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-handler"
version = "0.1.0"
description = "Lightweight file I/O utilities for structured data, text, and XML."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ry-yoshida" }
]
dependencies = [
  "numpy",
  "h5py",
  "PyYAML",
]

[project.urls]
"Homepage" = "https://github.com/ry-yoshida/FileHandler"
"Bug Tracker" = "https://github.com/ry-yoshida/FileHandler/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_handler = ["py.typed"]
txt_writer = ["py.typed"]
xml_handler = ["py.typed"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.39",
    "mypy",
    "pytest>=8.0",
    "ruff",
    "types-PyYAML",
]

[tool.uv]
exclude-newer = "7 days"

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
# h5py ships neither inline types nor a stub package.
module = ["h5py"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
